# Local development only. Run from the repository root:
# docker compose --env-file n8n/.env -f n8n/docker-compose.yml up -d
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.45.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5678
      WEBHOOK_URL: ${N8N_PUBLIC_URL:-http://localhost:5678/}
      # The exported schedule is explicitly 09:00 UTC, matching Convex date keys.
      GENERIC_TIMEZONE: UTC
      TZ: UTC
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in the private env file}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:?Set N8N_WEBHOOK_SECRET in the private env file}
      CONVEX_INBOUND_SECRET: ${CONVEX_INBOUND_SECRET:?Set CONVEX_INBOUND_SECRET in the private env file}
      CONVEX_SITE_URL: ${CONVEX_SITE_URL:?Set CONVEX_SITE_URL to the Convex HTTP action URL}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      # Internal runners keep this local mock setup self-contained. Use isolated
      # external task runners for production and allow crypto on those runners.
      N8N_RUNNERS_MODE: internal
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: "true"
      # HTTP is local only; enable secure cookies when serving n8n over HTTPS.
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_PUBLIC_API_DISABLED: "true"
      N8N_PAYLOAD_SIZE_MAX: "1"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "24"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "1000"
      # Serializes automatic production executions in this single-process demo.
      # Manual runs and external providers still need proper idempotency keys.
      N8N_CONCURRENCY_PRODUCTION_LIMIT: "1"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  n8n_data:
